name: Build Arch Linux Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to publish to (optional)"
        required: false
        default: ""
        type: string
      build_arch:
        description: "Linux architecture to build"
        required: true
        default: "x64"
        type: choice
        options:
          - x64

jobs:
  build-archlinux:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Arch build dependencies
        run: |
          pacman -Sy --noconfirm --needed base-devel fakeroot git

      - name: Clean workspace
        run: rm -rf dist dist_electron node_modules ~/.cache/electron-builder ~/.cache/electron

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Arch Linux package
        run: pnpm run build:arch

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicGo-Arch-${{ github.event.inputs.build_arch }}
          path: dist/*.pkg.tar.zst
